<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">How a composite index enables a fast top-50 login query</title><desc id="d">A B-tree groups entries by user ID, sorts each user's entries by descending timestamp and ID, and reads the newest fifty without sorting all matches.</desc><rect width="1200" height="470" rx="22" fill="#0b1220"/><g font-family="Arial,sans-serif"><text x="50" y="58" font-size="30" font-weight="700" fill="#f8fafc">Composite index: (user_id, logged_in_at DESC, id DESC)</text><text x="50" y="94" font-size="17" fill="#94a3b8">Seek to user 123, then read records already sorted newest first</text><rect x="52" y="140" width="280" height="86" rx="14" fill="#1e3a5f" stroke="#60a5fa"/><text x="192" y="174" text-anchor="middle" font-size="22" fill="#dbeafe" font-weight="700">WHERE user_id = 123</text><text x="192" y="203" text-anchor="middle" font-size="17" fill="#bfdbfe">B-tree range seek</text><path d="M333 183 H391" stroke="#93c5fd" stroke-width="4"/><path d="M381 176 L394 183 L381 190" fill="none" stroke="#93c5fd" stroke-width="4"/><rect x="405" y="126" width="510" height="245" rx="16" fill="#182333" stroke="#64748b"/><g font-size="18"><text x="441" y="160" fill="#94a3b8">Indexed user ID</text><text x="630" y="160" fill="#94a3b8">Timestamp (descending)</text><text x="845" y="160" fill="#94a3b8">Event ID</text></g><g font-size="19" fill="#e2e8f0"><rect x="426" y="178" width="468" height="43" rx="8" fill="#14532d"/><text x="446" y="205">123</text><text x="638" y="205">2026-11-10 15:30</text><text x="851" y="205">9001</text><text x="446" y="250">123</text><text x="638" y="250">2026-11-10 15:20</text><text x="851" y="250">8999</text><text x="446" y="294">123</text><text x="638" y="294">2026-11-10 15:00</text><text x="851" y="294">8998</text><text x="638" y="343" fill="#94a3b8">… next ordered entries …</text></g><path d="M918 212 H967" stroke="#34d399" stroke-width="4"/><path d="M957 205 L970 212 L957 219" fill="none" stroke="#34d399" stroke-width="4"/><rect x="977" y="158" width="177" height="112" rx="12" fill="#123c31" stroke="#34d399"/><text x="1066" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#d1fae5">LIMIT 50</text><text x="1066" y="220" text-anchor="middle" font-size="16" fill="#a7f3d0">Stop early</text><text x="1066" y="244" text-anchor="middle" font-size="15" fill="#a7f3d0">No large sort</text><text x="52" y="429" font-size="17" fill="#94a3b8">Actual timing depends on selectivity, buffer cache, heap visibility, disk I/O and load.</text></g></svg>