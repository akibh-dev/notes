<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Scaling a billion-row login-history system</title><desc id="d">Requests pass from authenticated API to Redis cache, then a shard router sends cache misses to PostgreSQL primary servers, each with time partitions, indexes and read replicas.</desc><rect width="1200" height="680" rx="25" fill="#0b1220"/><text x="60" y="62" font-size="29" font-family="Arial,sans-serif" font-weight="700" fill="#f1f5f9">From one table to distributed reads and writes</text><text x="60" y="96" font-size="17" font-family="Arial,sans-serif" fill="#94a3b8">A logical architecture — add complexity only when the workload requires it</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="460" y="122" width="280" height="66" rx="14" fill="#1e293b" stroke="#64748b"/><text x="600" y="150" font-size="20" font-weight="700" fill="#fff">Authenticated API</text><text x="600" y="172" font-size="14" fill="#94a3b8">Read and write requests</text><path d="M600 188 V218" stroke="#94a3b8" stroke-width="3"/><path d="M594 211 L600 219 L606 211" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="460" y="223" width="280" height="70" rx="14" fill="#123c31" stroke="#34d399"/><text x="600" y="251" font-size="21" font-weight="700" fill="#d1fae5">Redis cache</text><text x="600" y="273" font-size="14" fill="#a7f3d0">Cache hit: return immediately</text><path d="M600 293 V324" stroke="#94a3b8" stroke-width="3"/><text x="675" y="316" text-anchor="start" font-size="14" fill="#94a3b8">cache miss</text><rect x="460" y="328" width="280" height="65" rx="14" fill="#1e3a5f" stroke="#60a5fa"/><text x="600" y="356" font-size="21" font-weight="700" fill="#dbeafe">Shard router</text><text x="600" y="376" font-size="14" fill="#bfdbfe">Hash stable user ID to owner</text><path d="M600 393 V416 H241 V436 M600 416 H958 V436" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M600 416 V436" stroke="#60a5fa" stroke-width="3"/><rect x="95" y="442" width="292" height="173" rx="16" fill="#1e293b" stroke="#64748b"/><rect x="454" y="442" width="292" height="173" rx="16" fill="#1e293b" stroke="#64748b"/><rect x="813" y="442" width="292" height="173" rx="16" fill="#1e293b" stroke="#64748b"/><g fill="#f8fafc" font-weight="700" font-size="20"><text x="241" y="477">Shard A</text><text x="600" y="477">Shard B</text><text x="959" y="477">Shard C</text></g><g fill="#93c5fd" font-size="16"><text x="241" y="506">Writable primary</text><text x="600" y="506">Writable primary</text><text x="959" y="506">Writable primary</text></g><g fill="#cbd5e1" font-size="15"><text x="241" y="535">Monthly partitions</text><text x="600" y="535">Monthly partitions</text><text x="959" y="535">Monthly partitions</text><text x="241" y="559">Composite B-tree indexes</text><text x="600" y="559">Composite B-tree indexes</text><text x="959" y="559">Composite B-tree indexes</text><text x="241" y="587">+ read replicas</text><text x="600" y="587">+ read replicas</text><text x="959" y="587">+ read replicas</text></g></g><text x="600" y="650" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#94a3b8">Replication copies data within a shard · Sharding distributes different users across servers</text></svg>