<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Offset versus keyset pagination</title><desc id="d">Offset pagination reads and discards many records before returning 50, whereas keyset pagination seeks to a cursor and reads the next 50.</desc><rect width="1200" height="480" rx="22" fill="#0b1220"/><g font-family="Arial,sans-serif"><text x="52" y="59" font-size="30" font-weight="700" fill="#f8fafc">Deep pagination: OFFSET versus keyset</text><rect x="55" y="103" width="520" height="300" rx="17" fill="#1e293b" stroke="#f59e0b"/><rect x="625" y="103" width="520" height="300" rx="17" fill="#1e293b" stroke="#34d399"/><text x="90" y="144" font-size="25" font-weight="700" fill="#fbbf24">OFFSET 4,999,950</text><text x="660" y="144" font-size="25" font-weight="700" fill="#6ee7b7">Keyset cursor</text><text x="90" y="174" font-size="17" fill="#cbd5e1">Walk and discard millions of entries</text><text x="660" y="174" font-size="17" fill="#cbd5e1">Seek near last timestamp + ID</text><rect x="91" y="211" width="390" height="54" rx="8" fill="#78350f"/><rect x="481" y="211" width="57" height="54" rx="8" fill="#14532d"/><text x="283" y="243" text-anchor="middle" font-size="18" font-weight="700" fill="#fef3c7">Skipped entries</text><text x="508" y="243" text-anchor="middle" font-size="15" fill="#d1fae5">50</text><rect x="662" y="211" width="91" height="54" rx="8" fill="#1e3a5f" stroke="#60a5fa"/><text x="708" y="243" text-anchor="middle" font-size="17" fill="#bfdbfe">Seek</text><path d="M760 239 H811" stroke="#34d399" stroke-width="3"/><path d="M804 233 L813 239 L804 245" stroke="#34d399" stroke-width="3" fill="none"/><rect x="821" y="211" width="289" height="54" rx="8" fill="#14532d"/><text x="965" y="243" text-anchor="middle" font-size="21" font-weight="700" fill="#d1fae5">Next 50 rows</text><text x="92" y="330" font-size="18" fill="#fbbf24">Work grows with page number</text><text x="662" y="330" font-size="18" fill="#6ee7b7">Work tracks requested page size</text><text x="600" y="450" text-anchor="middle" font-size="16" fill="#94a3b8">Keyset needs a deterministic ordering, e.g. ORDER BY logged_in_at DESC, id DESC.</text></g></svg>